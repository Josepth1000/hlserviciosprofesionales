requirements:
  - >-
    Una (1) fotocopia de la cédula del cotizante.
  - >-
    Fotocopia de la cédula del cónyuge.
  - >-
    Registro civil de matrimonio o declaración extrajuicio.
  - >-
    Registro civil de nacimiento de los niños menores de 7 años.
  - >-
    Registro civil de nacimiento y copia de la tarjeta de identidad para los
    niños mayores de 7 años.
  - >-
    Para las personas solteras: pueden afiliar a sus padres anexando fotocopia de
    la cédula de los padres y el registro civil de nacimiento del cotizante donde
    acredite el parentesco.
notes:
  - >-
    Toda persona que ejecuta labores de riesgo debe estar afiliada al sistema de
    seguridad social (EPS, ARL y pensión), según la Ley 100 de 1993.
  - >-
    HL Servicios Profesionales se encuentra adscrita a La Equidad para cubrir el
    sistema de riesgos laborales (ARL), con todos los riesgos (I, II, III, IV y
    V), entidad de prestigio nacional elegida por su seriedad y cumplimiento en
    la indemnización por accidentes de trabajo.
  - >-
    Adicionalmente realizamos convenios de prestación de servicios para empresas
    basados en el manejo de la seguridad social de la nómina de empleados,
    incluyendo la emisión de desprendibles de pago, certificados laborales y
    asesorías generales.
  - >-
    Si desea acceder a la caja de compensación se deben cancelar $30.000 (treinta
    mil pesos) adicionales sobre los valores estipulados en la tabla.
