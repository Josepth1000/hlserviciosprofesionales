about:
  seoTitle: Quiénes Somos
  seoDescription: >-
    Conozca a HL Servicios Profesionales: más de 10 años de asesoría jurídica,
    contable y de seguridad social en Bucaramanga, Santander.
  hero:
    title: Quiénes Somos
    subtitle: >-
      Más de 10 años brindando soluciones de éxito con una asesoría oportuna,
      sólida, honesta y confiable.
    image: /images/firma-contrato.jpg
  label: Nuestra firma
  title: Soluciones de éxito para nuestros clientes
  paragraph1: >-
    HL Servicios Profesionales es una firma especializada en prestar servicios
    en seguridad social, dispuesta a brindarle la mejor asesoría en afiliaciones
    de salud, ARL, pensión y caja de compensación para todos los sectores
    económicos, además de servicios jurídicos, contables y de seguros.
  paragraph2: >-
    Todos nuestros servicios cuentan con el respaldo de más de 10 años de
    servicio valorados por nuestros clientes: garantizamos una asesoría
    oportuna, sólida, honesta y confiable.
  locationLabel: Ubicación
  founder:
    name: Henry López Beltrán
    role: Gerente General
    bio: >-
      Lidera la firma con una visión integral de la asesoría profesional en
      seguridad social, derecho, contabilidad y seguros.
    image: /images/firma-contrato.jpg
  values:
    label: Nuestros principios
    title: Asesoría con valores
    intro: >-
      La confianza de nuestros clientes se construye sobre cuatro principios que
      nos guían en cada asesoría.
