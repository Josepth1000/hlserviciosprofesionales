    subtitle: >-
      Estamos para ayudarte. Escríbenos, llámanos o visítanos en nuestras
      oficinas de Bucaramanga.
    image: /images/seguros/image.jpg
  label: Escríbenos
  title: Solicita tu asesoría
  intro: >-
    Completa el formulario y te responderemos a la brevedad. También puedes
    escribirnos por WhatsApp para una respuesta inmediata.
