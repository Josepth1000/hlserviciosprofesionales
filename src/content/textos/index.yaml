afiliacion:
  seoTitle: Cómo me afilio
  seoDescription: >-
    Conoce los planes de afiliación a seguridad social (salud, ARL, pensión y
    caja de compensación) y los requisitos para vincularte.
  hero:
    title: ¿Cómo me afilio?
    subtitle: >-
      Escoge tu mejor plan. Afiliaciones a salud, ARL, pensión y caja de
      compensación para todos los sectores económicos.
    image: /images/seguridad-social/image.avif
  plansLabel: Planes de afiliación
  plansTitle: Escoge tu mejor plan
  planColumnHeader: Plan
