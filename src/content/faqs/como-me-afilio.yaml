question: ¿Cómo me afilio al sistema de seguridad social?
answer: >-
  Escoge el plan que mejor se ajuste a tu presupuesto en la página "Cómo me
  afilio" y presenta los documentos requeridos. Te acompañamos durante todo el
  proceso de afiliación a salud (EPS), ARL, pensión y caja de compensación.
order: 1
