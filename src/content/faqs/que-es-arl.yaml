question: '¿Qué es la ARL y por qué es obligatoria?'
answer: >-
  La ARL (Administradora de Riesgos Laborales) protege al trabajador ante
  accidentes de trabajo y enfermedades laborales. Toda persona que ejecuta
  labores de riesgo debe estar afiliada al sistema de seguridad social (EPS, ARL
  y pensión) según la Ley 100 de 1993. Estamos adscritos a La Equidad para
  cubrir todos los riesgos (I, II, III, IV y V).
order: 3
