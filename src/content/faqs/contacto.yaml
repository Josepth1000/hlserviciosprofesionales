question: ¿Cómo puedo contactarlos?
answer: >-
  Puedes escribirnos por WhatsApp, llamarnos, enviarnos un correo o visitarnos
  en la Carrera 12 # 34 - 67 Oficina 205, Edificio Los Castellanos, Bucaramanga
  - Santander - Colombia. Te atendemos de lunes a viernes de 8:00 a. m. a 6:00
  p. m. y los sábados de 8:00 a. m. a 1:00 p. m.
