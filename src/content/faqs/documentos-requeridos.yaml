question: '¿Qué documentos necesito para afiliarme?'
answer: >-
  Una fotocopia de la cédula del cotizante, la cédula del cónyuge, el registro
  civil de matrimonio o declaración extrajuicio y los registros civiles de los
  hijos. Para personas solteras también es posible afiliar a los padres
  presentando sus cédulas y el registro civil del cotizante.
order: 2
