name: CI

# La web vive en la raíz de este repositorio, así que los pasos corren aquí.
on:
  push:
    branches: [main]
  pull_request:

# Un empujón nuevo cancela la ejecución anterior de la misma rama: no tiene
# sentido gastar minutos revisando un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: check y build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` instala exactamente lo que fija package-lock.json y falla si el
      # lockfile y package.json no coinciden.
      - name: Instalar dependencias
        run: npm ci

      # El plan pedía `npm audit` en CI. Por ahora informa pero no bloquea:
      #  · npm marca como crítica GHSA-26w7-cxv4-gfx2 (RCE en la optimización de
      #    AVIF), que este proyecto ya tiene resuelta con astro 7.4.13 y sharp
      #    0.35.5, cuando la versión parcheada es 7.2.8.
      #  · Las altas que quedan viven en el árbol de @astrojs/vercel y el
      #    «arreglo» que propone npm es bajar el adaptador a 8.0.4.
      # Cuando esas dos cosas se resuelvan, se quita `continue-on-error`.
      - name: Auditar dependencias
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Revisar tipos y plantillas
        run: npm run check

      - name: Compilar el sitio
        run: npm run build
