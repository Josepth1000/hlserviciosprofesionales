name: CI

# La web vive en la raíz de este repositorio, así que los pasos corren aquí.
on:
  push:
    branches: [main]
  pull_request:

# Un empujón nuevo cancela la ejecución anterior de la misma rama: no tiene
# sentido gastar minutos revisando un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: check y build
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` instala exactamente lo que fija package-lock.json y falla si el
      # lockfile y package.json no coinciden.
      - name: Instalar dependencias
        run: npm ci

      # `npm audit --audit-level=high` a secas agrupa los avisos por paquete: le
      # pega a un nodo el rango unión de todos sus avisos y la severidad del
      # peor, así que marca como crítica una versión que ningún aviso cubre.
      # El script revisa aviso por aviso contra la versión del lockfile y solo
      # bloquea lo que tiene parche sin cambiar de versión mayor.
      - name: Auditar dependencias
        run: node scripts/audit.mjs

      - name: Revisar tipos y plantillas
        run: npm run check

      - name: Compilar el sitio
        run: npm run build
